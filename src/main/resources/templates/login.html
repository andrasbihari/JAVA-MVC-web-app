<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bejelentkezés</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004085; }
        .error { color: red; margin-bottom: 15px; }
        .success { color: green; margin-bottom: 15px; }
        .link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Bejelentkezés</h2>
    
    <!-- Hibák és sikeres regisztráció visszajelzése -->
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email cím:</label>
            <input type="email" name="email" required />
        </div>
        <div class="form-group">
            <label>Jelszó:</label>
            <input type="password" name="password" required />
        </div>
        <button type="submit">Belépés</button>
    </form>
    
    <div class="link">
        Még nincs fiókod? <a th:href="@{/register}">Regisztrálj itt</a>
    </div>
</div>
</body>
</html>
