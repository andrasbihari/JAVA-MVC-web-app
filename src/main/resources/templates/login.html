<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <!-- Bootstrap 5 CSS CDN -->
    <!-- <link href="https://jsdelivr.net" rel="stylesheet"> -->
	<link th:href="@{/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 p-sm-5">
                    <h3 class="card-title text-center mb-4 fw-bold text-primary">Bejelentkezés</h3>
                    
                    <!-- Hibák és sikeres regisztráció visszajelzése -->
                    <div th:if="${error}" class="alert alert-danger py-2 text-center small" role="alert" th:text="${error}"></div>
                    <div th:if="${success}" class="alert alert-success py-2 text-center small" role="alert" th:text="${success}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-3">
                            <input type="email" name="email" class="form-control" id="floatingInput" placeholder="nev@domain.com" required>
                            <label for="floatingInput">Email cím</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Jelszó" required>
                            <label for="floatingPassword">Jelszó</label>
                        </div>

                        <button class="btn btn-primary w-100 text-uppercase fw-bold gl-4 py-2" type="submit">Belépés</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center small">
                        Még nincs fiókod? <a th:href="@{/register}" class="text-decoration-none fw-bold">Regisztrálj itt</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
