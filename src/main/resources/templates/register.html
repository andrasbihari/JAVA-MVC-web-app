<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Regisztráció</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error { color: red; margin-bottom: 15px; }
        .link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Vevő Regisztráció</h2>
    
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${vevo}" method="post">
        <div class="form-group">
            <label>Vezetéknév:</label>
            <input type="text" th:field="*{vezeteknev}" required />
        </div>
        <div class="form-group">
            <label>Keresztnév:</label>
            <input type="text" th:field="*{keresztnev}" required />
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required />
        </div>
        <div class="form-group">
            <label>Város:</label>
            <input type="text" th:field="*{varos}" required />
        </div>
        <div class="form-group">
            <label>Jelszó:</label>
            <!-- A sima jelszót külön paraméterként olvassa be a Controller, nem a vevo objektumba menti -->
            <input type="password" name="password" required />
        </div>
        <button type="submit">Regisztráció</button>
    </form>
    
    <div class="link">
        Már van fiókod? <a th:href="@{/login}">Jelentkezz be</a>
    </div>
</div>
</body>
</html>
