<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
<!--    <link href="https://jsdelivr.net" rel="stylesheet">-->
	<link th:href="@{/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow border-0 rounded-3 my-5">
                <div class="card-body p-4 p-sm-5">
                    <h3 class="card-title text-center mb-4 fw-bold text-success">Vevő Regisztráció</h3>
                    
                    <div th:if="${error}" class="alert alert-danger py-2 text-center small" role="alert" th:text="${error}"></div>

                    <form th:action="@{/register}" th:object="${vevo}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold text-muted">Vezetéknév</label>
                                <input type="text" th:field="*{vezeteknev}" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold text-muted">Keresztnév</label>
                                <input type="text" th:field="*{keresztnev}" class="form-control" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Email cím</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="pelda@email.hu" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Város</label>
                            <input type="text" th:field="*{varos}" class="form-control" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Jelszó</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required />
                        </div>

                        <button class="btn btn-success w-100 text-uppercase fw-bold py-2" type="submit">Regisztráció</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center small">
                        Már van fiókod? <a th:href="@{/login}" class="text-decoration-none fw-bold text-success">Jelentkezz be</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
