<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Ellenőrzés</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: center; }
        .form-group input { width: 80%; padding: 10px; font-size: 20px; text-align: center; letter-spacing: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #138496; }
        .error { color: red; margin-bottom: 15px; text-align: center; }
        .info { color: #555; margin-bottom: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Email cím ellenőrzése</h2>
    <p class="info">Kiküldtünk egy 6 számjegyű kódot az e-mail címedre. (A teszteléshez nézd meg az Eclipse **Console** fülét!)</p>
    
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/verify-email}" method="post">
        <div class="form-group">
            <input type="text" name="code" maxlength="6" placeholder="000000" required autocomplete="off"/>
        </div>
        <button type="submit">Kód ellenőrzése</button>
    </form>
</div>
</body>
</html>
