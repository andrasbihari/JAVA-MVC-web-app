<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vevők Listája</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #343a40; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .logout-btn { padding: 8px 15px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; }
        .logout-btn:hover { background-color: #c82333; }
        .user-info { font-style: italic; color: #555; }
    </style>
</head>
<body>
<div class="header">
    <h2>Regisztrált Vevők Adatbázisa (Oracle)</h2>
    <div>
        <span class="user-info">Üdv, <span th:text="${currentUser.vezeteknev + ' ' + currentUser.keresztnev}">Felhasználó</span>! </span>
        <a th:href="@{/logout}" class="logout-btn">Kijelentkezés</a>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Vezetéknév</th>
            <th>Keresztnév</th>
            <th>Email cím</th>
            <th>Város</th>
        </tr>
    </thead>
    <tbody>
        <!-- Végigiterálunk a Controllerből kapott listán -->
        <tr th:each="v : ${vevokLista}">
            <td th:text="${v.vevoId}">1</td>
            <td th:text="${v.vezeteknev}">Minta</td>
            <td th:text="${v.keresztnev}">János</td>
            <td th:text="${v.email}">janos@minta.hu</td>
            <td th:text="${v.varos}">Budapest</td>
        </tr>
        <tr th:if="${#lists.isEmpty(vevokLista)}">
            <td colspan="5" style="text-align: center;">Nincs még regisztrált vevő az adatbázisban.</td>
        </tr>
    </tbody>
</table>
</body>
</html>
