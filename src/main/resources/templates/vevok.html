<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vevők Listája</title>
<!--    <link href="https://jsdelivr.net" rel="stylesheet">-->
	<link th:href="@{/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigációs sáv (Header) -->
<nav class="navbar navbar-dark bg-dark shadow mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold text-truncate">
            <span class="text-info">Oracle DB</span> Vevőkezelő Rendszer
        </span>
        <div class="d-flex align-items-center">
            <span class="navbar-text text-white me-3 d-none d-sm-inline">
                Üdv, <strong class="text-warning" th:text="${currentUser.vezeteknev + ' ' + currentUser.keresztnev}">Felhasználó</strong>!
            </span>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm fw-bold">Kijelentkezés</a>
        </div>
    </div>
</nav>

<!-- Fő tartalom -->
<div class="container">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <h4 class="mb-4 fw-bold text-secondary text-center text-sm-start">Regisztrált Vevők Adatbázisa</h4>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" style="width: 10%">ID</th>
                            <th scope="col">Vezetéknév</th>
                            <th scope="col">Keresztnév</th>
                            <th scope="col">Email cím</th>
                            <th scope="col">Város</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Végigiterálunk a listán -->
                        <tr th:each="v : ${vevokLista}">
                            <td class="fw-bold text-muted" th:text="${v.vevoId}">1</td>
                            <td th:text="${v.vezeteknev}">Minta</td>
                            <td th:text="${v.keresztnev}">János</td>
                            <td th:text="${v.email}">janos@minta.hu</td>
                            <td th:text="${v.varos}">Budapest</td>
                        </tr>
                        <!-- Ha üres a lista -->
                        <tr th:if="${#lists.isEmpty(vevokLista)}">
                            <td colspan="5" class="text-center text-muted py-4">Nincs még regisztrált vevő az adatbázisban.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
